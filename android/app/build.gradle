plugins { id 'com.android.application' }
android {
    namespace 'com.litehelm.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.litehelm.mobile'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.0'
        testInstrumentationRunner 'com.litehelm.mobile.ProfileVaultTest'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    // In-app language switching needs every translation in the installed package.
    bundle { language { enableSplit = false } }
}
