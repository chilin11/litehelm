plugins { id 'com.android.application' }
android {
    namespace 'com.litehelm.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.litehelm.mobile'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'com.litehelm.mobile.ProfileVaultTest'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
