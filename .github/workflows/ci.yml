name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test and vet
        working-directory: server
        run: |
          go test -race ./...
          go vet ./...
      - name: Build native binaries
        run: |
          sh scripts/build-server.sh
          python3 scripts/checksums.py
      - name: Check installer and sandbox
        run: |
          sh -n install.sh deploy/install.sh scripts/build-server.sh scripts/test-install.sh
          shellcheck install.sh deploy/install.sh scripts/build-server.sh scripts/test-install.sh
          sudo env LITEHELM_TEST_DISPOSABLE=1 sh scripts/test-install.sh
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint
        run: android/gradlew -p android assembleDebug lintDebug --console plain
      - uses: actions/upload-artifact@v4
        with:
          name: LiteHelm-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
